// JaCoCo code-coverage configuration for unit tests.
// Applied from app/build.gradle. Measures coverage for a single flavor+buildType
// (default: niramayDebug) so we don't run all 8 flavors' unit tests.
//
// Usage:
//   ./gradlew jacocoTestReport             -> runs the full unit test suite, then prints
//                                              per-class + overall coverage to the console
//                                              (also writes HTML at app/build/reports/jacoco/jacocoTestReport/html/index.html)
//   ./gradlew jacocoCoverageVerification   -> fails the build if coverage < minimum
//   override flavor:    -PcoverageVariant=sakshamDebug
//   override threshold: -PminimumCoverage=0.90
//   limit console table to worst N classes: -PcoverageTopN=30

apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.12"
}

// Variant (flavor + build type) used to measure coverage.
def coverageVariant = project.hasProperty("coverageVariant") ? project.coverageVariant : "niramayDebug"
def capitalizedVariant = coverageVariant.substring(0, 1).toUpperCase() + coverageVariant.substring(1)
def unitTestTask = "test${capitalizedVariant}UnitTest"

// Minimum overall coverage (0.0 - 1.0). Target for this ticket is 90%.
def minimumCoverage = project.hasProperty("minimumCoverage") ? project.minimumCoverage.toBigDecimal() : 0.90

// Enable per-test coverage instrumentation for the debug build type.
// NOTE: enableUnitTestCoverage affects only local JVM unit tests. It does NOT
// instrument or repackage the APK (that would be enableAndroidTestCoverage).
android {
    buildTypes {
        debug {
            enableUnitTestCoverage true
        }
    }
}

// Classes generated by frameworks/tooling that carry no meaningful test value.
def coverageExclusions = [
        // Android framework generated
        '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
        '**/*Test*.*', 'android/**/*.*',
        // Data binding / view binding
        '**/databinding/**', '**/*Binding.*', '**/BR.*',
        // Hilt / Dagger generated
        '**/*_Hilt*.*', '**/hilt_aggregated_deps/**', '**/*_Factory.*',
        '**/*_MembersInjector.*', '**/Dagger*.*', '**/*_GeneratedInjector.*',
        '**/*Module.*', '**/*Module_*.*', '**/*Component*.*',
        // Room generated implementations
        '**/*Dao_Impl.*', '**/*Database_Impl.*', '**/*_Impl.*',
        // Dependency-injection wiring
        '**/di/**',
        // Android view layer (not unit-tested; ViewModels are kept)
        '**/*Fragment.*', '**/*Fragment$*.*',
        '**/*Fragement.*', '**/*Fragement$*.*',
        '**/*Activity.*', '**/*Activity$*.*',
        '**/*Adapter.*', '**/*Adapter$*.*',
        '**/*Dialog.*', '**/*Dialog$*.*',
        '**/*BottomSheet.*', '**/*BottomSheet$*.*',
        '**/*ViewHolder.*', '**/*ViewHolder$*.*',
        // Kotlin synthetic / generated
        '**/*$*Lambda$*.*', '**/*$inlined$*.*',
        // Fragment/BottomSheetDialogFragment subclasses whose class name doesn't end in
        // Fragment/BottomSheet, so they slip past the patterns above (same root cause as the
        // Fragement typo case) — verified by inspection to extend Fragment/BottomSheetDialogFragment.
        '**/HRPMicroBirthPlanTable.*', '**/HRPMicroBirthPlanTable$*.*',
        '**/NCDReferTypeFilter.*', '**/NCDReferTypeFilter$*.*',
        '**/NcdRefferedList.*', '**/NcdRefferedList$*.*',
        '**/FilariaMdaCampaignHistory.*', '**/FilariaMdaCampaignHistory$*.*',
        // ListAdapter subclasses whose name doesn't end in "Adapter" — same root cause as above,
        // verified by inspection to extend androidx.recyclerview.widget.ListAdapter.
        '**/FormInputAdapterWithBgIcon.*', '**/FormInputAdapterWithBgIcon$*.*',
        '**/FormInputAdapterOld.*', '**/FormInputAdapterOld$*.*',
        '**/BenListAdapterForForm.*', '**/BenListAdapterForForm$*.*'
]

def coverageClassDirs = {
    files([
            fileTree(dir: "${buildDir}/tmp/kotlin-classes/${coverageVariant}", excludes: coverageExclusions),
            fileTree(dir: "${buildDir}/intermediates/javac/${coverageVariant}/classes", excludes: coverageExclusions)
    ])
}

def coverageSourceDirs = files(["src/main/java", "src/main/kotlin"])

def coverageExecData = {
    fileTree(dir: buildDir, includes: [
            "outputs/unit_test_code_coverage/${coverageVariant}UnitTest/${unitTestTask}.exec",
            "jacoco/${unitTestTask}.exec"
    ])
}

tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn unitTestTask
    group = "verification"
    description = "Generates a JaCoCo coverage report for ${coverageVariant} unit tests."

    reports {
        html.required = true
        xml.required = true
        csv.required = true
    }

    classDirectories.setFrom(coverageClassDirs())
    sourceDirectories.setFrom(coverageSourceDirs)
    executionData.setFrom(coverageExecData())
}

// Prints per-class and overall coverage numbers straight to the console, so anyone
// running the plain `./gradlew jacocoTestReport` command sees the numbers immediately
// without opening the HTML report or needing any other tool.
// Resolved at configuration time (not inside doLast) since reading project properties
// during task execution is unsupported with the configuration cache enabled.
def coverageTopN = project.hasProperty("coverageTopN") ? project.coverageTopN.toInteger() : null

tasks.register("jacocoConsoleReport") {
    dependsOn "jacocoTestReport"
    group = "verification"
    description = "Prints per-class and overall coverage for ${coverageVariant} unit tests to the console."

    def csvFile = layout.buildDirectory.file("reports/jacoco/jacocoTestReport/jacocoTestReport.csv")
    inputs.file(csvFile).withPathSensitivity(PathSensitivity.NONE)

    doLast {
        def csv = csvFile.get().asFile
        def lines = csv.readLines()
        def header = lines[0].split(",")
        def rows = lines.drop(1).findAll { !it.isBlank() }.collect { it.split(",", -1) }

        def colIndex = { String name -> header.toList().indexOf(name) }
        int iPackage = colIndex("PACKAGE")
        int iClass = colIndex("CLASS")
        int iInsMissed = colIndex("INSTRUCTION_MISSED")
        int iInsCovered = colIndex("INSTRUCTION_COVERED")

        def classStats = rows.collect { r ->
            long insMissed = r[iInsMissed] as long
            long insCovered = r[iInsCovered] as long
            long total = insMissed + insCovered
            double pct = total == 0 ? 100.0d : (insCovered * 100.0d / total)
            [pkg: r[iPackage], cls: r[iClass], covered: insCovered, total: total, pct: pct]
        }.sort { it.pct }

        def topN = coverageTopN ?: classStats.size()
        def shown = classStats.take(topN)

        println ""
        println "=".multiply(100)
        println "Per-class INSTRUCTION coverage - ${coverageVariant} - worst first" +
                (topN < classStats.size() ? " (showing worst ${topN} of ${classStats.size()})" : " (${classStats.size()} classes)")
        println "=".multiply(100)
        shown.each { s ->
            printf("%6.1f%%  %8d/%-8d  %s.%s%n", s.pct, s.covered, s.total, s.pkg.replace('/', '.'), s.cls)
        }

        long totalInsMissed = rows.sum { it[iInsMissed] as long } as long
        long totalInsCovered = rows.sum { it[iInsCovered] as long } as long

        println ""
        println "=".multiply(100)
        println "TOTAL - ${coverageVariant} - full unit test suite (${rows.size()} classes)"
        printf("  INSTRUCTION coverage (PR-check metric, min %s): %d/%d (%.1f%%)%n",
                minimumCoverage, totalInsCovered, totalInsCovered + totalInsMissed,
                100.0d * totalInsCovered / (totalInsCovered + totalInsMissed))
        println "=".multiply(100)
    }
}

tasks.named("jacocoTestReport") {
    finalizedBy "jacocoConsoleReport"
}

tasks.register("jacocoCoverageVerification", JacocoCoverageVerification) {
    dependsOn "jacocoTestReport"
    group = "verification"
    description = "Fails the build if ${coverageVariant} coverage is below ${minimumCoverage}."

    violationRules {
        rule {
            limit {
                counter = "INSTRUCTION"
                value = "COVEREDRATIO"
                minimum = minimumCoverage
            }
        }
    }

    classDirectories.setFrom(coverageClassDirs())
    sourceDirectories.setFrom(coverageSourceDirs)
    executionData.setFrom(coverageExecData())
}
