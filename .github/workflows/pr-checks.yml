name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Pushes to long-lived branches give SonarCloud the reference that PRs are compared
  # against for "new code" (FLW-1208).
  push:
    branches: ['main', 'release-*']

concurrency:
  # Pushes have no PR number; group them by branch instead.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Job level so the SonarCloud step's `if` can check it (a step's own env is not
    # visible to its `if`). Empty on fork PRs, which skips the scan.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Full history: SonarCloud uses git blame to decide which lines are new code.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # packages: the action's default is "tools platform-tools", but Google removed
      # the legacy `tools` package from the SDK repository on 2026-09-14, so sdkmanager
      # exits 1 on it and the step fails. Request platform-tools only; the action still
      # installs cmdline-tools and accepts the licences, and AGP pulls the platform and
      # build-tools it needs. v2 is not an option here - it declares no inputs at all,
      # so `packages` would be silently ignored (and it still runs on the deprecated
      # node16 runtime).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Caches ~/.gradle (dependency jars, wrapper dist, build cache).
      # cache-read-only is off so each PR seeds its own cache scope: the first
      # run of a PR is no slower than today, every later push to it restores.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Restores the previous compile so Kotlin recompiles incrementally instead
      # of from scratch - the ~12-15 min that dominates this job. Only compile
      # outputs and Kotlin's incremental state are cached; test results, reports
      # and JaCoCo .exec files are deliberately excluded so every run still
      # executes the full suite and computes coverage fresh.
      - name: Cache Gradle build state
        uses: actions/cache@v4
        with:
          path: |
            app/build/intermediates
            app/build/generated
            app/build/kotlin
            app/build/tmp
            .gradle
          key: build-state-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            build-state-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Decode google-services.json
        run: |
          # Secrets are unavailable for pull_request workflows triggered from a fork
          # (GitHub does not pass repo secrets to fork PRs). Fall back to a placeholder
          # so the build can still compile and the coverage check still runs; these
          # values never need to be real for a unit-test/coverage job.
          SECRET='${{ secrets.GOOGLE_SERVICES_JSON_GENERIC }}'
          if [ -n "$SECRET" ]; then
            echo "$SECRET" | base64 --decode > app/google-services.json
          else
            # package_name must match this variant's actual applicationId (base id +
            # applicationIdSuffix), or the Google Services plugin fails with
            # "No matching client found for package name '...'" - verified locally.
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"flw-ci-placeholder","storage_bucket":"flw-ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"org.piramalswasthya.sakhi.niramay"}},"oauth_client":[],"api_key":[{"current_key":"AIzaCiPlaceholderPlaceholderPlaceholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # --build-cache and the fork settings are passed here rather than in
      # gradle.properties / build.gradle so local and release builds keep their
      # current behaviour exactly (defaults stay 80 / 2).
      # forkEvery=300 cuts ~10 test-JVM restarts per worker. It also means more
      # test classes share a JVM, so if a test that leaks static state starts
      # failing here but passes locally, this is the first thing to revert.
      - name: Run unit tests and verify coverage
        run: ./gradlew jacocoCoverageVerification --console=plain --build-cache -PtestMaxParallelForks=4 -PtestForkEvery=300

      # Runs even when the 90% coverage check above failed, as long as the report exists, so
      # the PR still gets its SonarCloud result. Skipped when SONAR_TOKEN is not available
      # (fork PRs, or before the secret is added). The configuration cache is off for this
      # step only, so the scanner can read the project model; the test step keeps it.
      # sonar.qualitygate.wait makes this step fail when the quality gate fails.
      - name: SonarCloud scan
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' && hashFiles('app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml') != '' }}
        run: ./gradlew sonar --console=plain --no-configuration-cache -Dsonar.qualitygate.wait=true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html
          retention-days: 14
