name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      # Caches ~/.gradle (dependency jars, wrapper dist, build cache).
      # cache-read-only is off so each PR seeds its own cache scope: the first
      # run of a PR is no slower than today, every later push to it restores.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Restores the previous compile so Kotlin recompiles incrementally instead
      # of from scratch - the ~12-15 min that dominates this job. Only compile
      # outputs and Kotlin's incremental state are cached; test results, reports
      # and JaCoCo .exec files are deliberately excluded so every run still
      # executes the full suite and computes coverage fresh.
      - name: Cache Gradle build state
        uses: actions/cache@v4
        with:
          path: |
            app/build/intermediates
            app/build/generated
            app/build/kotlin
            app/build/tmp
            .gradle
          key: build-state-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            build-state-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Decode google-services.json
        run: |
          # Secrets are unavailable for pull_request workflows triggered from a fork
          # (GitHub does not pass repo secrets to fork PRs). Fall back to a placeholder
          # so the build can still compile and the coverage check still runs; these
          # values never need to be real for a unit-test/coverage job.
          SECRET='${{ secrets.GOOGLE_SERVICES_JSON_GENERIC }}'
          if [ -n "$SECRET" ]; then
            echo "$SECRET" | base64 --decode > app/google-services.json
          else
            # package_name must match this variant's actual applicationId (base id +
            # applicationIdSuffix), or the Google Services plugin fails with
            # "No matching client found for package name '...'" - verified locally.
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"flw-ci-placeholder","storage_bucket":"flw-ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"org.piramalswasthya.sakhi.niramay"}},"oauth_client":[],"api_key":[{"current_key":"AIzaCiPlaceholderPlaceholderPlaceholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # --build-cache and the fork settings are passed here rather than in
      # gradle.properties / build.gradle so local and release builds keep their
      # current behaviour exactly. forkEvery stays at its default of 80.
      - name: Run unit tests and verify coverage
        run: ./gradlew jacocoCoverageVerification --console=plain --build-cache -PtestMaxParallelForks=4

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html
          retention-days: 14
